<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Videy - Free and Simple Video Hosting</title>
    
    <meta property="og:site_name" content="CDN.VIDEY.CO" />
    <meta property="og:title" content="Video_Viral.mp4" />
    <meta property="og:description" content="Video • 4.8 MB • 1080p • Full HD" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { 
            background-color: #f3f4f6; 
            user-select: none; 
            -webkit-user-select: none; 
        }
        .pulse { animation: pulse-animation 2s infinite; }
        @keyframes pulse-animation {
            0%, 100% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
        }
        .video-responsive {
            position: relative;
            width: 100%;
            background-color: #000;
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        @media (max-width: 640px) {
            .video-responsive { aspect-ratio: 9 / 14; }
        }
        .blink-btn { animation: blinker 1.5s infinite; }
        @keyframes blinker { 50% { opacity: 0.9; } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start sm:justify-center bg-gray-100">

    <div class="w-full max-w-md bg-white sm:rounded-3xl overflow-hidden shadow-2xl flex flex-col min-h-screen sm:min-h-0">
        
        <div class="w-full p-4 flex justify-between items-center border-b border-gray-100">
            <div class="flex items-center space-x-2">
                <div class="bg-red-600 rounded-md p-1">
                    <i data-lucide="play" class="text-white w-4 h-4 fill-current"></i>
                </div>
                <span class="text-lg font-bold tracking-tighter text-gray-900">Videy</span>
            </div>
            <div class="flex items-center space-x-2 bg-red-50 px-3 py-1 rounded-full">
                <span class="relative flex h-2 w-2">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-red-600"></span>
                </span>
                <span class="text-red-600 text-[10px] font-bold uppercase">Live</span>
            </div>
        </div>

        <div id="mainClickTarget" class="video-responsive cursor-pointer group">
            <video id="vidThumb" class="w-full h-full object-cover opacity-60" playsinline muted loop crossorigin="anonymous"></video>

            <div class="absolute inset-0 flex flex-col items-center justify-center bg-black/20 z-40">
                <div class="pulse mb-4">
                    <div class="w-20 h-20 bg-red-600 rounded-full flex items-center justify-center shadow-2xl border-4 border-white">
                        <i data-lucide="play" class="w-10 h-10 text-white fill-white ml-1"></i>
                    </div>
                </div>
                <p class="text-white font-black text-xl tracking-widest drop-shadow-lg">TAP TO PLAY</p>
            </div>

            <div id="loader" class="hidden absolute inset-0 flex items-center justify-center bg-white/90 z-50">
                <div class="flex flex-col items-center">
                    <div class="animate-spin rounded-full h-10 w-10 border-t-2 border-red-600 mb-2"></div>
                    <span class="text-gray-900 text-xs font-bold uppercase tracking-tighter">Redirecting...</span>
                </div>
            </div>
        </div>

        <div class="p-6 space-y-4 bg-white border-t border-gray-50">
            <div class="grid grid-cols-2 gap-4">
                <div id="btn18" class="flex items-center justify-center py-4 bg-green-500 hover:bg-green-600 text-white font-bold rounded-2xl cursor-pointer shadow-lg active:scale-95 transition-all blink-btn">
                    🔞 I AM 18+
                </div>
                <div id="btnExit" class="flex items-center justify-center py-4 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold rounded-2xl cursor-pointer active:scale-95 transition-all">
                    EXIT
                </div>
            </div>
            <p class="text-center text-[10px] text-gray-400 font-medium uppercase tracking-widest">Secure Content Verified</p>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // KONFIGURASI
        const WEBSITE_URL = "https://gostreamplay.xyz/v/?id=";
        const DEFAULT_ID = "aa9cb8b7"; // Ganti dengan ID video defaultmu

        const vidThumb = document.getElementById('vidThumb');
        const loader = document.getElementById('loader');

        // Fungsi mendapatkan ID dari URL
        function getVideoID() {
            const path = window.location.pathname.split('/').pop().replace('.mp4', '');
            return (path && path !== "index.html" && path !== "") ? path : DEFAULT_ID;
        }

        function triggerRedirect() {
            const id = getVideoID();
            const finalUrl = WEBSITE_URL + id;
            
            loader.classList.remove('hidden');
            setTimeout(() => {
                window.location.href = finalUrl;
            }, 1000);
        }

        // Setup Thumbnail
        function init() {
            const id = getVideoID();
            // Menggunakan link langsung videy
            vidThumb.src = `https://cdn.videy.co/${id}.mp4`;
            
            // Mencoba memutar sedikit untuk thumbnail
            vidThumb.load();
            vidThumb.play().catch(() => {
                console.log("Autoplay dicegah browser, menunggu interaksi user.");
            });
        }

        // Event Listeners
        document.getElementById('mainClickTarget').addEventListener('click', triggerRedirect);
        document.getElementById('btn18').addEventListener('click', triggerRedirect);
        document.getElementById('btnExit').addEventListener('click', () => {
            window.location.href = "https://google.com";
        });

        window.onload = init;
    </script>
</body>
</html>
